# 여행 데이터 파일 (trip-planner v0.1 샘플)
# 모든 사실은 이 파일에 딱 한 번만 적는다. 인포그래픽, 웹앱, 지도, 시트는 전부 여기서 만든다.
# 샘플이다: 날짜(2027년 7월)와 여행자 나이는 지어낸 값이고, 숙소는 역(공공장소) 좌표로 둔 예시다.
#   요일 규칙이 맞게 골랐다: 7/19(월)이 바다의 날이라 월요일 휴원인 동물원이 열고 7/20(화)에 쉰다.
#    영업시간과 전화번호는 2026-10-07 기준 공개 정보를 옮긴 것이라 쓰기 전에 다시 확인할 것.
# 개인정보 없음: 사람 이름 대신 "어른 1" 처럼 적는다.

trip:
  title: 도쿄 가족여행
  destination: 일본 도쿄
  start: 2027-07-17
  end: 2027-07-20
  currency: JPY
  checked: 2026-10-07          # 이 파일의 사실을 마지막으로 확인한 날
  stale_days: 400              # 장소 확인일이 여행 시작보다 이만큼 넘게 오래되면 경고 (실제 여행은 30 쯤. 샘플이라 크게)

travelers:
  - {label: 어른 1, age: 41}
  - {label: 어른 2, age: 39}
  - {label: 아이 1, age: 9, notes: 매운 음식 못 먹음}

holidays:
  - {date: 2027-07-19, name: 바다의 날}

arrival:                         # 도착은 하나만
