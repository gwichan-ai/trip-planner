tips:
  - title: 캐리어는 26인치 이하
    body: 기내 반입이 아니어도 지하철과 코인로커를 쓰면 큰 캐리어가 짐이 된다. 역 코인로커 큰 칸이 대개 이 크기까지다.
  - title: 코인로커는 아침에 잡는다
    body: 체크아웃 시각대에는 역 로커가 빨리 찬다. 못 잡으면 숙소에 맡기는 안을 둔다.

